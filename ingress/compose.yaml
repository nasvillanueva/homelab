name: homelab-ingress

services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - HOMELAB_DOMAIN=${HOMELAB_DOMAIN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOMELAB_CONFIG_DIR}/caddy/data:/data
      - ${HOMELAB_CONFIG_DIR}/caddy/config:/config
    networks:
      - gateway
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  gateway:
    name: homelab_gateway
    external: true
