name: homelab-media

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    env_file:
      - ./.gluetun.env
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ${HOMELAB_DATA_DIR}/gluetun:/gluetun
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 256M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${HOMELAB_DATA_DIR}/qbittorrent:/config
      - ${DOWNLOADS_DIR}:/downloads
    deploy:
      resources:
        limits:
          memory: 1G

  downloadarr:
    build:
      context: .
      dockerfile: images/downloadarr/Dockerfile
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - ${HOMELAB_DATA_DIR}:/root/.yt-dlp
      - ${MEDIA_DIR}:/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - 8989:8989
    environment: &common-env
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${HOMELAB_DATA_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/data/media
      - ${DOWNLOADS_DIR}:/data/torrents
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 1G

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - 7878:7878
    environment: *common-env
    volumes:
      - ${HOMELAB_DATA_DIR}/radarr:/config
      - ${MEDIA_DIR}:/data/media
      - ${DOWNLOADS_DIR}:/data/torrents
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 1G

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    ports:
      - 9696:9696
    environment: *common-env
    volumes:
      - ${HOMELAB_DATA_DIR}/prowlarr:/config
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 512M

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    ports:
      - 8191:8191
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 1G

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    ports:
      - 5055:5055
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${HOMELAB_DATA_DIR}/seerr:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  media:
    name: homelab_media
